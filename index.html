<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥋 Judo Kids Manager</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.0.0/dist/umd/supabase.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 50px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    }

    h1 {
      color: white;
      margin-bottom: 40px;
      text-align: center;
      font-size: 36px;
      font-weight: 700;
    }

    h2 {
      color: rgba(255, 255, 255, 0.9);
      margin-top: 30px;
      margin-bottom: 20px;
      font-size: 20px;
    }

    .auth-form {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 40px;
      border-radius: 20px;
      max-width: 420px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"],
    input[type="date"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    button {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.1));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-top: 15px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    button:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.15));
      border: 1px solid rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
    }

    .tab-button {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      padding: 12px 20px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      border-bottom: 2px solid transparent;
      transition: all 0.3s ease;
      margin-top: 0 !important;
    }

    .tab-button:hover {
      color: rgba(255, 255, 255, 0.8);
    }

    .tab-button.active {
      color: white;
      border-bottom-color: rgba(255, 255, 255, 0.5);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
    }

    .hidden {
      display: none !important;
    }

    .error {
      background: rgba(220, 38, 38, 0.3);
      color: rgba(255, 100, 100, 1);
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(220, 38, 38, 0.5);
      margin-bottom: 15px;
      font-size: 13px;
    }

    .success {
      background: rgba(34, 197, 94, 0.3);
      color: rgba(100, 255, 100, 1);
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(34, 197, 94, 0.5);
      margin-bottom: 15px;
      font-size: 13px;
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.1) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      padding: 8px 16px !important;
      font-size: 13px !important;
      width: auto !important;
      margin-top: 0 !important;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .subscriber-list {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 15px;
      padding: 20px;
    }

    .subscriber-item {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .subscriber-info {
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 8px;
    }

    .status-pending {
      background: rgba(251, 191, 36, 0.25);
      border: 1px solid rgba(251, 191, 36, 0.5);
      color: rgba(255, 210, 100, 1);
    }

    .status-sent {
      background: rgba(34, 197, 94, 0.25);
      border: 1px solid rgba(34, 197, 94, 0.5);
      color: rgba(100, 255, 100, 1);
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
    }

    .btn-sent {
      width: auto !important;
      padding: 6px 14px !important;
      font-size: 12px !important;
      margin-top: 10px !important;
    }

    p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .shipment-item {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    @media (max-width: 768px) {
      .container {
        padding: 30px;
      }

      h1 {
        font-size: 24px;
      }

      .header {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>
<body>

<div class="container" id="app">
  <!-- Login Screen -->
  <div id="authScreen" class="auth-form">
    <h1>🥋 Judo Kids Manager</h1>
    <div id="authMessage"></div>
    
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="Identifiant">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="Mot de passe">
    </div>
    <button onclick="login()">Se connecter</button>
  </div>

  <!-- Dashboard Screen -->
  <div id="dashScreen" class="hidden">
    <div class="header">
      <h1>🥋 Judo Kids Manager</h1>
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>

    <div class="tabs">
      <button class="tab-button active" onclick="switchTab('abonnes', event)">👥 Abonnés</button>
      <button class="tab-button" onclick="switchTab('envois', event)">📦 Envois</button>
    </div>

    <!-- Onglet Abonnés -->
    <div id="abonnes" class="tab-content active">
      <div class="form-card">
        <h2>➕ Ajouter un abonné</h2>
        <div id="addMessage"></div>
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" id="firstName" placeholder="Jean">
        </div>
        <div class="form-group">
          <label>Nom</label>
          <input type="text" id="lastName" placeholder="Dupont">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="subscriberEmail" placeholder="jean@example.com">
        </div>
        <div class="form-group">
          <label>Adresse</label>
          <input type="text" id="address" placeholder="123 Rue de la Paix, 75000 Paris">
        </div>
        <div class="form-group">
          <label>Date de début d'abonnement</label>
          <input type="date" id="startDate">
        </div>
        <button onclick="addSubscriber()">✓ Ajouter l'abonné</button>
      </div>

      <h2>📋 Liste des abonnés</h2>
      <div id="subscribersList" class="subscriber-list loading">
        Chargement...
      </div>
    </div>

    <!-- Onglet Envois -->
    <div id="envois" class="tab-content">
      <h2>📦 Calendrier d'envois</h2>
      <p>Les envois sont générés automatiquement au moment de créer un abonné. Cliquez sur "Marqué envoyé" pour mettre à jour le statut.</p>
      
      <div id="shipmentsList" class="loading">
        Chargement...
      </div>
    </div>
  </div>
</div>

<script>
  // ============================================
  // Supabase Config
  // ============================================
  const SUPABASE_URL = 'https://wojlwjplzlxkvqxmehdu.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indvamx3anBsemx4a3ZxeG1laGR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNjUwOTcsImV4cCI6MjEwNTY0MTA5N30.Ik7iEpdpSzCyGgMuPpy0oIokaWIWE9E7aE5t-9ePiMA';
  
  let supabase = null;
  let currentUser = null;
  let currentOrg = null;

  // Initialiser Supabase
  if (typeof window.supabase !== 'undefined') {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }

  // ============================================
  // AUTH - Seul login (pas d'inscription)
  // ============================================

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (!email || !password) {
      showMessage('authMessage', 'Remplis email et mot de passe', 'error');
      return;
    }

    try {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        showMessage('authMessage', error.message, 'error');
        return;
      }

      currentUser = data.user;
      await loadUserOrg();
      showDashboard();
    } catch (e) {
      showMessage('authMessage', e.message, 'error');
    }
  }

  async function logout() {
    await supabase.auth.signOut();
    currentUser = null;
    currentOrg = null;
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('dashScreen').classList.add('hidden');
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
  }

  async function loadUserOrg() {
    const { data, error } = await supabase
      .from('profiles')
      .select('organization_id')
      .eq('id', currentUser.id)
      .single();

    if (error) {
      showMessage('authMessage', 'Erreur: ' + error.message, 'error');
      return;
    }

    currentOrg = data.organization_id;
  }

  // ============================================
  // SUBSCRIBERS
  // ============================================

  async function addSubscriber() {
    const firstName = document.getElementById('firstName').value;
    const lastName = document.getElementById('lastName').value;
    const email = document.getElementById('subscriberEmail').value;
    const address = document.getElementById('address').value;
    const startDate = document.getElementById('startDate').value;

    if (!firstName || !lastName || !email || !startDate) {
      showMessage('addMessage', 'Remplis tous les champs requis', 'error');
      return;
    }

    const { data: subData, error: subError } = await supabase
      .from('subscribers')
      .insert([{
        organization_id: currentOrg,
        first_name: firstName,
        last_name: lastName,
        email: email,
        address: address,
        subscription_start_date: startDate
      }])
      .select();

    if (subError) {
      showMessage('addMessage', subError.message, 'error');
      return;
    }

    const subscriberId = subData[0].id;
    const shipments = generateShipments(subscriberId, startDate);
    const { error: shipError } = await supabase
      .from('shipments')
      .insert(shipments);

    if (shipError) {
      showMessage('addMessage', shipError.message, 'error');
      return;
    }

    showMessage('addMessage', '✓ Abonné ajouté avec 12 envois générés!', 'success');
    clearForm();
    loadSubscribers();
    loadShipments();
  }

  function generateShipments(subscriberId, startDate) {
    const start = new Date(startDate);
    const shipments = [];

    for (let i = 1; i <= 12; i++) {
      const shipDate = new Date(start);
      shipDate.setMonth(shipDate.getMonth() + Math.floor((i - 1) / 2));

      shipments.push({
        subscriber_id: subscriberId,
        shipment_number: i,
        scheduled_date: shipDate.toISOString().split('T')[0],
        magazine_number: ((i - 1) % 6) + 1,
        poster_number: ((i - 1) % 6) + 1,
        sticker_pair: i,
        status: 'pending'
      });
    }

    return shipments;
  }

  async function loadSubscribers() {
    if (!currentOrg) return;

    const { data, error } = await supabase
      .from('subscribers')
      .select('*')
      .eq('organization_id', currentOrg)
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('subscribersList').innerHTML = `<div class="error">Erreur: ${error.message}</div>`;
      return;
    }

    if (data.length === 0) {
      document.getElementById('subscribersList').innerHTML = '<div class="loading">Aucun abonné pour le moment.</div>';
      return;
    }

    document.getElementById('subscribersList').innerHTML = data.map(sub => `
      <div class="subscriber-item">
        <div class="subscriber-info">
          <strong>${sub.first_name} ${sub.last_name}</strong><br>
          ${sub.email}<br>
          <small style="opacity: 0.7;">Depuis: ${formatDate(sub.subscription_start_date)}</small>
        </div>
      </div>
    `).join('');
  }

  async function loadShipments() {
    if (!currentOrg) return;

    const { data, error } = await supabase
      .from('shipments')
      .select(`
        *,
        subscribers(first_name, last_name, email)
      `)
      .eq('subscribers.organization_id', currentOrg)
      .order('scheduled_date', { ascending: true });

    if (error) {
      document.getElementById('shipmentsList').innerHTML = `<div class="error">Erreur: ${error.message}</div>`;
      return;
    }

    if (data.length === 0) {
      document.getElementById('shipmentsList').innerHTML = '<div class="loading">Aucun envoi pour le moment.</div>';
      return;
    }

    document.getElementById('shipmentsList').innerHTML = data.map(ship => `
      <div class="shipment-item">
        <div class="subscriber-info">
          <strong>${ship.subscribers.first_name} ${ship.subscribers.last_name}</strong><br>
          📅 ${formatDate(ship.scheduled_date)} | 
          📖 Mag #${ship.magazine_number} | 
          🎨 Poster #${ship.poster_number} | 
          ✨ Stickers #${ship.sticker_pair}
          <br>
          <span class="status-badge status-${ship.status}">
            ${ship.status === 'pending' ? '⏳ En attente' : '✅ Envoyé'}
          </span>
        </div>
        ${ship.status === 'pending' ? `<button class="btn-sent" onclick="markAsSent('${ship.id}')">Marqué envoyé</button>` : ''}
      </div>
    `).join('');
  }

  async function markAsSent(shipmentId) {
    const { error } = await supabase
      .from('shipments')
      .update({ status: 'sent', sent_at: new Date().toISOString() })
      .eq('id', shipmentId);

    if (error) {
      alert('Erreur: ' + error.message);
      return;
    }

    loadShipments();
  }

  // ============================================
  // UI
  // ============================================

  function showDashboard() {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('dashScreen').classList.remove('hidden');
    loadSubscribers();
    loadShipments();
  }

  function switchTab(tab, event) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    event.target.classList.add('active');
  }

  function showMessage(elementId, message, type) {
    const el = document.getElementById(elementId);
    el.innerHTML = `<div class="${type}">${message}</div>`;
  }

  function clearForm() {
    document.getElementById('firstName').value = '';
    document.getElementById('lastName').value = '';
    document.getElementById('subscriberEmail').value = '';
    document.getElementById('address').value = '';
    document.getElementById('startDate').value = '';
  }

  function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('fr-FR', { 
      year: 'numeric', 
      month: 'long', 
      day: 'numeric' 
    });
  }

  // ============================================
  // INIT - Check session
  // ============================================

  async function init() {
    if (!supabase) return;
    const { data: { user } } = await supabase.auth.getUser();
    if (user) {
      currentUser = user;
      await loadUserOrg();
      showDashboard();
    }
  }

  init();
</script>

</body>
</html>
